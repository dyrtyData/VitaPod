[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
  "artifacts",
  "bundle",
  "ezkl_cli",
  "export_model",
  "model",
  "normalization",
  "pipeline",
  "report",
]
